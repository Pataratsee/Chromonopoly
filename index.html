<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2E6B4F" />
    <title>Chromonopoly</title>
    <script id="static-source-redirect">
      // The source page loads /src/main.ts and only works through Vite. GitHub
      // Pages (and any plain static server) must use the bundled app instead.
      // Keep Vite's dev server (5173-5180) on the source entry.
      (() => {
        const port = Number(location.port);
        const viteDev = port >= 5173 && port <= 5180;
        const alreadyBuilt = location.pathname.includes('/dist/');
        if (!viteDev && !alreadyBuilt) {
          location.replace(new URL('dist/', location.href).href);
        }
      })();
    </script>
  </head>
  <body>
    <canvas id="scene" aria-label="Chromonopoly board"></canvas>
    <div id="ui"></div>
    <div id="boot" class="boot">
      <div class="boot-mark">CHROMONOPOLY</div>
      <div class="boot-bar"><i></i></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
