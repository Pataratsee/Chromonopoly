name: Deploy to GitHub Pages

# One-time repository setup:
# Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require game server URL
        run: |
          if [ -z "$VITE_GAME_SERVER_URL" ]; then
            echo "::error::Set the repository variable VITE_GAME_SERVER_URL to the Render service URL."
            exit 1
          fi
          case "$VITE_GAME_SERVER_URL" in
            https://*) ;;
            *) echo "::error::VITE_GAME_SERVER_URL must be an https:// origin."; exit 1 ;;
          esac
        env:
          VITE_GAME_SERVER_URL: ${{ vars.VITE_GAME_SERVER_URL }}

      - name: Build game
        run: npm run build
        env:
          VITE_GAME_SERVER_URL: ${{ vars.VITE_GAME_SERVER_URL }}

      - name: Smoke-test Pages artifact
        run: npm run check:pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
